version: '3.8'

services:
  react-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    deploy:  
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    read_only: true  
    security_opt:
      - no-new-privileges:true  
    cap_drop:
      - ALL  
    