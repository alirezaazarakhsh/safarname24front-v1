version: "3.9"

services:
  nextapp:
    build: .
    container_name: safarname-next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

    # محدودیت منابع
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

    # قفل امنیتی
    read_only: true
    security_opt:
      - no-new-privileges:true
