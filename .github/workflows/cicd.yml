name: Deploy Next.js App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test Build (Optional - continue on failure)
        run: npm run build
        continue-on-error: true  # اگر build شکست، job ادامه پیدا کنه (چون build اصلی روی سرور انجام می‌شه)

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no -v -p 2394 sasha@${{ secrets.SERVER_IP }} << 'EOF'
            echo "Connected successfully as sasha on port 2394"
            cd /var/safarname24front-v1 || { echo "Directory not found!"; exit 1; }

            # بروزرسانی کد
            git pull origin main

            # توقف و حذف کانتینرهای قدیمی
            docker compose down || true

            # بازسازی و راه‌اندازی
            docker compose up -d --build

            # پاک کردن تصاویر قدیمی (اختیاری)
            docker image prune -f || true

            echo "Deployment completed successfully!"
          EOF
