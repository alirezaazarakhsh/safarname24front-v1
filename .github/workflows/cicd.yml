name: Deploy Next.js App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2394 -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -p 2394 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            echo "🚀 Connected to server"

            cd /var/safarname24front-v1 || {
              echo "❌ ERROR: Deployment directory not found!";
              exit 1;
            }

            echo "🧹 Cleaning local changes..."
            git reset --hard HEAD
            git clean -fd

            echo "📥 Pulling latest code..."
            git fetch --all
            git reset --hard origin/main

            echo "🛑 Stopping old containers..."
            docker compose down || true

            echo "🔨 Rebuilding containers..."
            docker compose up -d --build

            echo "🧼 Cleaning old Docker images..."
            docker image prune -f || true

            echo "✅ Deployment completed at $(date)"
          EOF
