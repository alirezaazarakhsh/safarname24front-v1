name: Deploy Next.js App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test Build (Optional)
        run: npm run build
        continue-on-error: true  # اگر build لوکال شکست، ادامه بده

      - name: Setup SSH (Secure)
        run: |
          mkdir -p ~/.ssh
          
          # روش امن برای نوشتن کلید خصوصی (جلوگیری از leak تشخیص GitHub)
          printf "%s\n" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          
          chmod 600 ~/.ssh/id_rsa
          
          # اضافه کردن host key سرور
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          
          # چک ساده (بدون لو دادن کلید)
          echo "SSH key configured: $(wc -l < ~/.ssh/id_rsa) lines"

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no -v -p 2394 sasha@${{ secrets.SERVER_IP }} << 'EOF'
            echo "Successfully connected to server as sasha on port 2394"
            
            cd /var/safarname24front-v1 || { echo "Error: Directory not found!"; exit 1; }
            
            echo "Pulling latest code from main..."
            git pull origin main
            
            echo "Stopping old containers..."
            docker compose down || true
            
            echo "Building and starting new containers..."
            docker compose up -d --build
            
            echo "Pruning old images..."
            docker image prune -f || true
            
            echo "Deployment completed successfully on $(date)"
          EOF