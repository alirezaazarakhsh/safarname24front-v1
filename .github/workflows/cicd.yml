name: Deploy Next.js App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test Build
        run: npm run build
        continue-on-error: true

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          
          printf "%s\n" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          
          chmod 600 ~/.ssh/id_rsa
          
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "SSH key loaded: $(wc -l < ~/.ssh/id_rsa) lines"

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no -p 2394 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            echo "Connected as ${{ secrets.SERVER_USER }} on port 2394"
            
            cd /var/safarname24front-v1 || { echo "Directory not found!"; exit 1; }
            
            echo "Pulling latest code..."
            git pull origin main
            
            echo "Stopping old containers..."
            docker compose down || true
            
            echo "Rebuilding and starting containers..."
            docker compose up -d --build
            
            echo "Cleaning old images..."
            docker image prune -f || true
            
            echo "Deployment completed on $(date)"
          EOF