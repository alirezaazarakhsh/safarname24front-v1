name: Deploy Next.js App (Zero Downtime, No Source on Server)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: 2394
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./"
          target: "/var/www/safarname24front"

      - name: Deploy on Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          port: 2394
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Connected to server"

            cd /var/www/safarname24front

            NEW_TAG=$(date +%s)

            echo "🔧 Building new Docker image..."
            docker build -t safarname24front:$NEW_TAG .

            echo "🚀 Starting new container..."
            docker run -d --name safarname24front_new_$NEW_TAG -p 3000:3000 safarname24front:$NEW_TAG

            echo "⏳ Waiting for health check..."
            sleep 10

            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ New version healthy → switching traffic"
              docker stop safarname24front_old || true
              docker rm safarname24front_old || true
              docker rename safarname24front_new_$NEW_TAG safarname24front_old
            else
              echo "❌ New version unhealthy → keeping old version"
              docker stop safarname24front_new_$NEW_TAG || true
              docker rm safarname24front_new_$NEW_TAG || true
              exit 1
            fi

            echo "🧼 Cleaning old images..."
            docker image prune -f || true

            echo "✨ Zero‑downtime deployment completed!"
