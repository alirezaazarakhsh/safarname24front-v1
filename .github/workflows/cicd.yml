name: Deploy Next.js App (Zero Downtime)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2394 -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to Server (Zero Downtime)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -p 2394 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            echo "🚀 Connected to server"

            cd /var/safarname24front-v1 || {
              echo "❌ Deployment directory not found!";
              exit 1;
            }

            echo "🧹 Cleaning local changes..."
            git reset --hard HEAD
            git clean -fd

            echo "📥 Fetch latest changes..."
            git fetch --all

            echo "🔄 Sync with origin/main..."
            git reset --hard origin/main

            echo "🔧 Building new image..."
            NEW_TAG=$(date +%s)
            docker build -t safarname24front:$NEW_TAG .

            echo "🚀 Starting new container..."
            docker run -d --name safarname24front_new_$NEW_TAG -p 3000:3000 safarname24front:$NEW_TAG

            echo "⏳ Waiting for health check..."
            sleep 10

            echo "🩺 Checking health..."
            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ New version healthy → switching traffic"
              docker stop safarname24front_old || true
              docker rm safarname24front_old || true
              docker rename safarname24front_new_$NEW_TAG safarname24front_old
            else
              echo "❌ New version unhealthy → keeping old version"
              docker stop safarname24front_new_$NEW_TAG || true
              docker rm safarname24front_new_$NEW_TAG || true
              exit 1
            fi

            echo "🧼 Cleaning old images..."
            docker image prune -f || true

            echo "✨ Zero‑downtime deployment completed at $(date)"
          EOF
